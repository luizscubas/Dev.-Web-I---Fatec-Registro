<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outras mídias</title>
</head>
<body>
    <header>
        <h1>
            other mídias in html5
        </h1>
    </header>
    <main>
        <section>
            <h2>Aúdio</h2>
            <audio controls src="audio.mp3"></audio>

            <video controls src="video.mp4" type="video/mp4"
            ></video>
            <h2>Vídeo do youtube</h2> 
                <iframe 
                width="560" 
                height="315" 
                src="https://www.youtube.com/embed/noLU8isvpjo?si=iOI8tMgI6RpOHnNW" 
                title="YouTube video player" 
                frameborder="0" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                referrerpolicy="strict-origin-when-cross-origin" 
                allowfullscreen></iframe>

                <!-- incorporando mapas -->

                <h2>mapas (iframe)</h2>
                <iframe 
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d116208.47760541862!2d-47.89193069165662!3d-24.467609362148405!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94c53436f4f0c1cb%3A0xbab60b5cc9451e73!2sRegistro%2C%20SP%2C%2011900-000!5e0!3m2!1spt-BR!2sbr!4v1773192478543!5m2!1spt-BR!2sbr" 
                width="600" 
                height="450" 
                style="border:0;" 
                allowfullscreen="" 
                loading="lazy" 
                referrerpolicy="no-referrer-when-downgrade">

                </iframe>

                <!-- incorporando pdfs -->

                <h2> pdf (iframe)</h2>
                <iframe src="documento.pdf" frameborder="0"
                title="Horários DSM-1"
                width="560"
                height="520"
                >
            </iframe>

            <!-- incorporando vetores -->
             <h2>vetores (ilustrações)</h2>
            <svg width="22" 
            height="13" 
            viewBox="0 0 22 13" 
            fill="none" 
            xmlns="http://www.w3.org/2000/svg">
            <path d="M4 0H5V2H4V0ZM17 0H18V2H17V0ZM21 10V8H20V7H19V6H18V5H17V2H16V4H14V3H8V4H6V2H5V5H4V6H3V7H2V8H1V10H0V13H22V10H21ZM7 8V10H5V8H7ZM15 8H17V10H15V8Z" fill="black"/>
            </svg>
        </section>
    </main>
</body>
</html>
