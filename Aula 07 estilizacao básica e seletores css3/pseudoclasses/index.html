<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pseudoclasses</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Demonstração de seudo-classes</h1>
    <hr>
    <h2>: hover - é ativada quando o mouse passa sobre o elemento:</h2>
    <div class="caixa">
        passa o mouse aqui
    </div>
    <br> 

    <h2>: active - é ativada quando o elemento é clicado:</h2>
    <button class="btn-download">Download</button>

     <br> 

     <h2>focus - clique nos campos</h2>
     <form>
        <input type="text" placeholder="Clique aqui para focar">
        <input type="password" placeholder="Digite sua senha">
     </form>
</body>
</html>
