<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seletores básicos CSS3</title>

    <!-- importando css externo -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Seletores Básicos</h1>

    <!-- seletor de elemento -->
     <p>Este paragráfo é estilizado pelo seletor de elemento (p).</p>

     <section>
        <p>paragráfo estilizado por section e p.</p>
     </section>

     <p class="destaque">paragráfo estilizado pela classe "destaque"</p>

     <!-- Seletor de ID -->
     <!-- div cria uma divisão na página -->
      <div id="unico">
        Está div possui um ID único e é estilizada especificamente.
      </div>
    </body>
</html>
