<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pseudoelementos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Demonstração de pseudoelementos</h1>


    <h2>::before - é ativada quando o elemento é exibido:</h2>
    <p class="antes">esta frase vem antes.</p>
    <br>
    <h2>::after - é ativada quando o elemento é exibido:</h2>
    <p class="depois">Esta frase vem depois.</p>

    <blockquote class="citacao">
        Impossível derrubar quem já está caído.
    </blockquote>
</body>
</html>
