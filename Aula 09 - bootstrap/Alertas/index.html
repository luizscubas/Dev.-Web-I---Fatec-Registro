<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap - Alertas</title>

    <!-- importação do bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
    <main>
        <section>
            <h1>Alertas no Bootstrap</h1>
            <div>
            <p class="alert alert-primary">Alerta primário</p> 
            <p class="alert alert-secondary">Alerta secundário</p>
            <p class="alert alert-success">Alerta de sucesso</p>
            <p class="alert alert-danger">Alerta de perigo</p>
            <p class="alert alert-warning">Alerta de aviso</p>
            </div>
        </section>
        <section>
            <h1>Alertas com Botão</h1>

             <div><p class="alert alert-success alert-dismissible fade show"><button type="button" class="btn-close" data-bs-dismiss="alert"></button>Alerta com botão de fechar</p></div>
            <div>
                <p class="alert alert-primary">Alerta primário com  <button type="button" class="btn btn-primary">Botão</button></p><br>
            </div>
        </section>
    </main>
</body>

<!-- importando javascript do bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</html>
