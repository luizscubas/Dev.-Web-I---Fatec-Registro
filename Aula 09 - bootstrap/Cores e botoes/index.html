<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Importação do bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    
    <title>Bootstrap</title>
</head>
<body>
    <main>
        <section>
            <h1>Cores no Bootstrap</h1>
            <div>
            <p class="h3 text-muted">Classe muted</p>
            <p class="text-primary">Classe primary</p>
            <p class="text-success">Classe success</p>
            <p class="text-danger">Classe danger</p>
            <p class="text-info">Classe info</p>
            <p class="text-warning">Classe warning</p>
        </div>
        </section>
        <section>
            <h1>Botões no Bootstrap</h1>
            <button type="button" class="btn btn-primary">Primary</button> <br><br>
            <button type="button" class="btn btn-secondary">Secondary</button> <br><br>
            <button type="button" class="btn btn-success">Success</button> <br><br>
            <button type="button" class="btn btn-danger">Danger</button> <br><br>
            <button type="button" class="btn btn-warning">Warning</button> <br><br>
            <button type="button" class="btn btn-info">Info</button> <br><br>
            <button type="button" class="btn btn-link">Link</button> 
            <br><br>

            <button type="button" class="btn btn-outline-primary btn-lg">Outline Primary</button> <br><br>
            <button type="button" class="btn btn-outline-secondary btn-sm">Outline Secondary</button> <br><br>
        </section>
    </main>
</body>

<!-- importando javascript do bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

<!-- importamos scripts embaixo do body para melhorar o desempenho de carregamento da página -->
</html>
