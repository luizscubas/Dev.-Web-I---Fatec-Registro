<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sidebar com bootstrap</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
    <!-- botão para acionar o sidebar -->
    <button class="btn btn-primary my-4 mx-4" type="button" data-bs-toggle="offcanvas" data-bs-target="#meuSidebar">
        Abrir sidebar
    </button>
    <!-- sidebar -->
    <div class="offcanvas offcanvas-start" id="meuSidebar">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title">Meu sidebar</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body">
            <a href="" class="list-group-item">Home</a>
            <a href="" class="list-group-item">Sobre</a>
            <a href="" class="list-group-item">Contato</a>
        </div>
    </div>


    
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</html>
